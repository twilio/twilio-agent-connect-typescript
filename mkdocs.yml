site_name: Twilio Agent Connect (TypeScript)
site_description: A TypeScript framework for building agentic applications with Twilio
site_url: https://twilio.github.io/twilio-agent-connect-typescript/
repo_url: https://github.com/twilio/twilio-agent-connect-typescript
repo_name: twilio/twilio-agent-connect-typescript
copyright: Copyright &copy; Twilio

# The API reference under docs/api/ is generated by TypeDoc (npm run docs:api),
# not committed. Keep it out of the working tree via .gitignore.
docs_dir: docs

extra:
  version:
    provider: mike
    alias: true

theme:
  name: material
  logo: assets/twilio-logo.svg
  favicon: assets/twilio-logo.svg
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  # Builds the API Reference nav automatically from the TypeDoc-generated
  # folder tree under docs/api/ (classes/, interfaces/, functions/, etc.).
  - awesome-pages

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      # Allow docs pages to include files from the repo root (e.g. README.md).
      base_path: ["."]
      check_paths: true
  - toc:
      permalink: true
