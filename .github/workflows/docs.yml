name: Docs

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}

# Serialize doc deployments so concurrent releases don't clobber the gh-pages
# branch (each run appends a new version folder to the existing history).
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish versioned docs
    runs-on: ${{ github.repository_owner == 'twilio' && 'ubuntu-x64' || 'ubuntu-latest' }}
    if: github.repository_owner == 'twilio'
    permissions:
      contents: write # peaceiris/actions-gh-pages pushes to the gh-pages branch
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Artifactory OIDC Auth
        uses: ./.github/actions/artifactory-oidc

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22.13"
          cache: npm

      - run: npm ci

      # @shipgirl/typedoc-plugin-versions writes this release into docs/<version>/
      # and regenerates the version dropdown. keep_files below preserves the
      # previously published version folders already on the gh-pages branch, so
      # the dropdown keeps its full history.
      - name: Build docs
        run: npm run docs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "docs: publish ${{ github.ref_name }}"
