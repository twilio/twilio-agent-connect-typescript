name: Docs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 2.1.0). Defaults to package.json version."
        required: false

env:
  ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}

# Serialize doc deployments so concurrent releases don't clobber gh-pages.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish versioned docs
    runs-on: ${{ github.repository_owner == 'twilio' && 'ubuntu-x64' || 'ubuntu-latest' }}
    if: github.repository_owner == 'twilio'
    permissions:
      contents: write # mike pushes the built site to the gh-pages branch
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # mike needs full history of the gh-pages branch

      - name: Artifactory OIDC Auth
        uses: ./.github/actions/artifactory-oidc

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - run: npm ci

      - name: Install docs tooling
        run: pip install -r requirements-docs.txt

      - name: Generate API reference
        run: npm run docs:api

      - name: Verify docs build (strict)
        run: mkdocs build --strict

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing docs for version $VERSION"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy versioned docs
        # --alias-type=copy writes real files for the "latest" alias instead of a
        # symlink; GitHub Pages' legacy branch builder rejects symlinks.
        # VERSION is passed via env: (not interpolated into the script) so a
        # crafted workflow_dispatch input can't inject shell commands.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mike deploy --push --update-aliases --alias-type=copy "$VERSION" latest
          mike set-default --push latest
