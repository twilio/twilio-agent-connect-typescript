name: Release

on:
  release:
    types: [published]

jobs:
  test:
    name: Test
    runs-on: ubuntu-x64
    if: github.repository_owner == 'twilio'
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 20
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Artifactory OIDC Auth
        # twilio/sdk-actions#1 (merged) — repin to a release tag once one is cut
        uses: twilio/sdk-actions/artifactory-oidc@b84fe24294fdf3c48b553fca00f6806ee9b74a4c

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    name: Publish to npm
    needs: [test]
    runs-on: ubuntu-x64
    if: github.repository_owner == 'twilio'
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Artifactory OIDC Auth
        # twilio/sdk-actions#1 (merged) — repin to a release tag once one is cut
        uses: twilio/sdk-actions/artifactory-oidc@b84fe24294fdf3c48b553fca00f6806ee9b74a4c

      # Node 24+ required for npm OIDC trusted publisher support (npm >= 11.5.1)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - run: npm ci

      - run: npm run build

      - name: Validate tag + publish to npm
        # twilio/sdk-actions#1 (merged) — repin to a release tag once one is cut
        uses: twilio/sdk-actions/npm-publish@b84fe24294fdf3c48b553fca00f6806ee9b74a4c
